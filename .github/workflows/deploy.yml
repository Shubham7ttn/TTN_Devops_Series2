name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Test website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Basic website validation passed."

      - name: Build / Package
        run: |
          mkdir -p dist
          cp index.html style.css script.js dist/
          echo "Website packaged successfully."

      # AWS deployment will be added after the S3 bucket is created.
